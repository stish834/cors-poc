<!DOCTYPE html>
<html>
<head>
  <title>CORS PoC Tester</title>
</head>
<body>
  <h2>Dynamic CORS Misconfiguration Tester</h2>
  <input type="text" id="targetUrl" placeholder="Enter target URL">
  <button onclick="sendRequest()">Send Request</button>
  <pre id="output">Waiting for input...</pre>

  <script>
    function sendRequest() {
      const url = document.getElementById('targetUrl').value;
      const output = document.getElementById('output');

      output.textContent = 'Sending request to: ' + url;

      fetch(url, { credentials: 'include' })
        .then(res => res.text())
        .then(data => {
          output.textContent = '✅ Response:\n\n' + data;
        })
        .catch(err => {
          output.textContent = '❌ Error:\n\n' + err;
        });
    }
  </script>
</body>
</html>
